<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Data Table with Icons</title>
  <!-- Tailwind CSS via CDN (Play CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100">
  <div class="max-w-6xl mx-auto mt-10 p-6 bg-white rounded-xl shadow-md space-y-4">
    <!-- Top Bar -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div class="flex gap-2">
        <button class="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-md hover:bg-blue-700 transition">
          <i data-lucide="plus" class="w-4 h-4"></i>
          Add
        </button>
        <button class="flex items-center gap-2 px-4 py-2 bg-gray-100 text-gray-700 text-sm font-medium rounded-md hover:bg-gray-200 transition">
          <i data-lucide="download" class="w-4 h-4"></i>
          Export
        </button>
      </div>
      <div class="flex justify-center">
        <select class="w-48 px-3 py-2 text-sm border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
          <option>Show 10 entries</option>
          <option>Show 25 entries</option>
          <option>Show 50 entries</option>
        </select>
      </div>
      <div class="flex justify-end w-full md:w-auto">
        <div class="relative w-full md:w-64">
          <input type="text" placeholder="Search..."
            class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm focus:ring-blue-500 focus:border-blue-500" />
          <i data-lucide="search" class="absolute left-3 top-2.5 w-4 h-4 text-gray-400"></i>
        </div>
      </div>
    </div>

    <!-- Table -->
    <div class="overflow-x-auto border rounded-lg">
      <table class="min-w-full text-sm text-left text-gray-700">
        <thead class="bg-gray-100 text-xs uppercase text-gray-600">
          <tr>
            <th class="px-6 py-3">ID</th>
            <th class="px-6 py-3">Name</th>
            <th class="px-6 py-3">Email</th>
            <th class="px-6 py-3">Role</th>
            <th class="px-6 py-3">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-200 bg-white">
          <tr class="hover:bg-gray-50">
            <td class="px-6 py-4">1</td>
            <td class="px-6 py-4 font-medium text-gray-900">Alice Johnson</td>
            <td class="px-6 py-4">alice@example.com</td>
            <td class="px-6 py-4 text-indigo-600">Admin</td>
            <td class="px-6 py-4 space-x-2">
              <button class="inline-flex items-center text-blue-600 hover:underline text-sm gap-1">
                <i data-lucide="edit" class="w-4 h-4"></i> Edit
              </button>
              <button class="inline-flex items-center text-red-600 hover:underline text-sm gap-1">
                <i data-lucide="trash-2" class="w-4 h-4"></i> Delete
              </button>
            </td>
          </tr>
          <!-- Example additional rows -->
          <tr class="hover:bg-gray-50">
            <td class="px-6 py-4">2</td>
            <td class="px-6 py-4 font-medium text-gray-900">Bob Smith</td>
            <td class="px-6 py-4">bob@example.com</td>
            <td class="px-6 py-4 text-green-600">User</td>
            <td class="px-6 py-4 space-x-2">
              <button class="inline-flex items-center text-blue-600 hover:underline text-sm gap-1">
                <i data-lucide="edit" class="w-4 h-4"></i> Edit
              </button>
              <button class="inline-flex items-center text-red-600 hover:underline text-sm gap-1">
                <i data-lucide="trash-2" class="w-4 h-4"></i> Delete
              </button>
            </td>
          </tr>
          <!-- Add more rows as needed -->
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="flex flex-col md:flex-row items-center justify-between mt-4 space-y-2 md:space-y-0">
      <div class="text-sm text-gray-600">Showing 1 to 10 of 50 entries</div>
      <div class="flex items-center space-x-1">
        <button class="px-2 py-1 text-sm text-gray-500 bg-gray-100 rounded hover:bg-gray-200">
          <i data-lucide="chevrons-left" class="w-4 h-4"></i>
        </button>
        <button class="px-3 py-1 text-sm text-gray-700 bg-gray-100 rounded hover:bg-blue-700">1</button>
        <button class="px-3 py-1 text-sm text-gray-700 bg-gray-100 rounded hover:bg-gray-200">2</button>
        <button class="px-3 py-1 text-sm text-gray-700 bg-gray-100 rounded hover:bg-gray-200">3</button>
        <span class="px-2 text-sm text-gray-500">…</span>
        <button class="px-3 py-1 text-sm text-gray-700 bg-gray-100 rounded hover:bg-gray-200">5</button>
        <button class="px-2 py-1 text-sm text-gray-500 bg-gray-100 rounded hover:bg-gray-200">
          <i data-lucide="chevrons-right" class="w-4 h-4"></i>
        </button>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
